# Virtual DEST double-buffering: 4 matmul ops, PACK is the long pole.
#
# DEST is split in software into 2 banks (dest_banks: 2). MATH (FPU) writes a
# bank; PACK reads it. By alternating banks (0,1,0,1), MATH of the next op can
# fill bank 1 while PACK drains bank 0 — they overlap. A block can't reuse a
# bank until the PACK that last read it has finished, so MATH of op2 (bank 0)
# waits for PACK of op0 (bank 0).
#
# Try it, then change every dest_bank to 0 and re-run `schedule` to see the
# makespan grow (single-buffered: MATH always waits for the previous PACK).
#
#   tt-prism schedule examples/ops_dest_banks.yaml

title: "DEST double-buffering (4 matmuls, 2 banks)"
clock_ghz: 1.0
grid_clocks: 64
dest_banks: 2

lanes:
  - { id: trisc0, name: "TRISC 0", order: 0 }
  - { id: trisc1, name: "TRISC 1", order: 1 }
  - { id: trisc2, name: "TRISC 2", order: 2 }

resources:
  - { id: unpack, name: "UNPACK", color: "#ef9a9a" }
  - { id: fpu,    name: "FPU",    color: "#a5d6a7" }
  - { id: sfpu,   name: "SFPU",   color: "#90caf9" }
  - { id: pack,   name: "PACK",   color: "#ffcc80" }

ops:
  - id: mm0
    name: "matmul"
    kind: matmul
    tiles: 8
    blocks:
      - { id: mm0_u, lane_id: trisc0, resource_id: unpack, label: "unpack", duration_clocks: 52 }
      - { id: mm0_m, lane_id: trisc1, resource_id: fpu,    label: "C0=B0xA0", duration_clocks: 32, dest_bank: 0 }
      - { id: mm0_p, lane_id: trisc2, resource_id: pack,   label: "pack C0",  duration_clocks: 96, dest_bank: 0 }
  - id: mm1
    name: "matmul"
    kind: matmul
    tiles: 8
    blocks:
      - { id: mm1_u, lane_id: trisc0, resource_id: unpack, label: "unpack", duration_clocks: 52 }
      - { id: mm1_m, lane_id: trisc1, resource_id: fpu,    label: "C1=B1xA1", duration_clocks: 32, dest_bank: 1 }
      - { id: mm1_p, lane_id: trisc2, resource_id: pack,   label: "pack C1",  duration_clocks: 96, dest_bank: 1 }
  - id: mm2
    name: "matmul"
    kind: matmul
    tiles: 8
    blocks:
      - { id: mm2_u, lane_id: trisc0, resource_id: unpack, label: "unpack", duration_clocks: 52 }
      - { id: mm2_m, lane_id: trisc1, resource_id: fpu,    label: "C2=B2xA2", duration_clocks: 32, dest_bank: 0 }
      - { id: mm2_p, lane_id: trisc2, resource_id: pack,   label: "pack C2",  duration_clocks: 96, dest_bank: 0 }
  - id: mm3
    name: "matmul"
    kind: matmul
    tiles: 8
    blocks:
      - { id: mm3_u, lane_id: trisc0, resource_id: unpack, label: "unpack", duration_clocks: 52 }
      - { id: mm3_m, lane_id: trisc1, resource_id: fpu,    label: "C3=B3xA3", duration_clocks: 32, dest_bank: 1 }
      - { id: mm3_p, lane_id: trisc2, resource_id: pack,   label: "pack C3",  duration_clocks: 96, dest_bank: 1 }
